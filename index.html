<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --neon:   #39FF88;
    --cyan:   #34F5FF;
    --amber:  #FFD23D;
    --ink:    #EAFFF4;
    --dim:    rgba(57,255,136,0.25);
    --bg1:    #01100A;
    --bg2:    #000D07;
  }

  html, body {
    width: 100%; height: 100%;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    overflow: hidden;
    font-family: 'Share Tech Mono', monospace;
    color: var(--ink);
  }

  /* ── Starfield canvas ── */
  #stars {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  /* ── Grid overlay ── */
  #grid {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(57,255,136,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(57,255,136,0.04) 1px, transparent 1px);
    background-size: 42px 42px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── Main card ── */
  #card {
    position: relative; z-index: 1;
    width: min(640px, 92vw);
    margin: 0 auto;
    top: 50%; transform: translateY(-50%);
    padding: 48px 52px 44px;
    background: rgba(4,14,10,0.7);
    border: 1px solid rgba(57,255,136,0.28);
    box-shadow: 0 0 60px rgba(57,255,136,0.08), inset 0 0 40px rgba(0,0,0,0.4);
    clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 22px 100%, 0 calc(100% - 22px));
    backdrop-filter: blur(6px);
  }

  /* corner ticks */
  #card::before, #card::after {
    content: ''; position: absolute; width: 14px; height: 14px; border: 1.5px solid var(--cyan);
  }
  #card::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  #card::after  { bottom: -1px; right: -1px; border-left: none;  border-top: none; }

  /* ── Eyebrow ── */
  .eyebrow {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; letter-spacing: 3px;
    color: var(--cyan); text-transform: uppercase;
    margin-bottom: 28px; opacity: 0.85;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--neon); box-shadow: 0 0 8px var(--neon);
    animation: blink 1.6s infinite;
    flex-shrink: 0;
  }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.1;} }

  /* ── Heading ── */
  .star-prefix {
    font-size: clamp(28px, 5vw, 42px);
    color: var(--amber);
    text-shadow: 0 0 18px var(--amber);
    letter-spacing: 2px;
    display: block;
    margin-bottom: 6px;
    animation: flicker 4s infinite;
  }
  @keyframes flicker {
    0%,92%,96%,100%{ opacity:1; }
    94%{ opacity:0.5; }
  }

  h1 {
    font-family: 'Rajdhani', sans-serif;
    font-size: clamp(42px, 9vw, 72px);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 6px;
    color: var(--neon);
    text-shadow: 0 0 22px var(--dim), 0 0 60px rgba(57,255,136,0.15);
    line-height: 1;
    margin-bottom: 30px;
  }

  /* ── Quote ── */
  .quote {
    font-size: clamp(13px, 2.2vw, 15px);
    color: var(--ink);
    opacity: 0.78;
    line-height: 1.75;
    letter-spacing: 0.5px;
    border-left: 2px solid var(--neon);
    padding-left: 18px;
    margin-bottom: 38px;
    max-width: 480px;
  }
  .quote em {
    font-style: normal;
    color: var(--amber);
    text-shadow: 0 0 10px rgba(255,210,61,0.4);
  }

  /* ── Progress bar ── */
  .bar-label {
    font-size: 10px; letter-spacing: 2px; color: var(--cyan);
    text-transform: uppercase; margin-bottom: 8px; opacity: 0.7;
  }
  .track {
    width: 100%; height: 10px;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(57,255,136,0.25);
    overflow: hidden;
    position: relative;
    margin-bottom: 8px;
  }
  .fill {
    height: 100%;
    background: linear-gradient(90deg, #0c5c3a, var(--neon) 70%, var(--cyan));
    width: 0%;
    transition: width 0.6s ease;
    position: relative; overflow: hidden;
  }
  .fill::after {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      115deg,
      rgba(255,255,255,0.2) 0px, rgba(255,255,255,0.2) 2px,
      transparent 2px, transparent 10px
    );
    animation: stream 1s linear infinite;
  }
  @keyframes stream { to { background-position-x: -40px; } }
  .bar-pct {
    font-size: 11px; color: var(--neon); letter-spacing: 1px;
    text-align: right; opacity: 0.8;
  }

  /* ── Divider ── */
  .divider {
    width: 100%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--dim), transparent);
    margin: 32px 0;
  }

  /* ── Footer ── */
  .footer {
    font-size: 10px; letter-spacing: 2px;
    color: var(--cyan); opacity: 0.45;
    text-transform: uppercase;
  }
  #clock { margin-left: 6px; color: var(--neon); opacity: 0.6; }
</style>
</head>
<body>

<canvas id="stars"></canvas>
<div id="grid"></div>

<div id="card">
  <div class="eyebrow"><span class="dot"></span> OFC GAMERZ // STATUS_UPLINK</div>

  <span class="star-prefix">✦ Coming Soon ✦</span>
  <h1>Have<br>Patience</h1>

  <p class="quote">
    Sometimes having patience is also a sign —<br>
    a key to <em>success</em>.
  </p>

  <div class="bar-label">Loading progress</div>
  <div class="track"><div class="fill" id="fill"></div></div>
  <div class="bar-pct" id="pct">0%</div>

  <div class="divider"></div>

  <div class="footer">
    System time: <span id="clock"></span>
  </div>
</div>

<script>
  /* ── Starfield ─────────────────────────────── */
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    stars = Array.from({ length: 90 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.3 + 0.2,
      speed: Math.random() * 0.35 + 0.1,
      alpha: Math.random() * 0.55 + 0.15,
    }));
  }
  resize();
  window.addEventListener('resize', resize);

  function drawStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
      s.x -= s.speed;
      if (s.x < 0) { s.x = canvas.width; s.y = Math.random() * canvas.height; }
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(52,245,255,${s.alpha})`;
      ctx.fill();
    });
    requestAnimationFrame(drawStars);
  }
  drawStars();

  /* ── Progress bar animation ─────────────────── */
  let pct = 0;
  const fill = document.getElementById('fill');
  const pctEl = document.getElementById('pct');
  const target = 73; // feels "almost there" — not 100%

  const barTimer = setInterval(() => {
    if (pct >= target) { clearInterval(barTimer); return; }
    pct += Math.random() * 1.4 + 0.2;
    pct = Math.min(pct, target);
    fill.style.width = pct + '%';
    pctEl.textContent = Math.round(pct) + '%';
  }, 120);

  /* ── Live clock ─────────────────────────────── */
  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');
    document.getElementById('clock').textContent = `${h}:${m}:${s}`;
  }
  updateClock();
  setInterval(updateClock, 1000);
</script>

</body>
</html>
