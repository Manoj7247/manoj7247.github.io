<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OFC GAMERZ — Gaming HQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <style>
    :root {
      --neon-green: #00ff9f;
      --neon-cyan:  #00e5ff;
      --neon-blue:  #0077ff;
      --dark-bg:    #020b0f;
      --card-bg:    #061520;
      --border:     #0a2a35;
      --glow-green: 0 0 8px #00ff9f, 0 0 20px #00ff9f55, 0 0 40px #00ff9f22;
      --glow-cyan:  0 0 8px #00e5ff, 0 0 20px #00e5ff55, 0 0 40px #00e5ff22;
      --text-primary: #e0fff8;
      --text-muted:   #4a8a7a;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--dark-bg);
      color: var(--text-primary);
      font-family: 'Rajdhani', Arial, sans-serif;
      font-size: 16px;
      cursor: none;
      overflow-x: hidden;
    }

    /* ═══════════════════════════════
       LOADER
    ═══════════════════════════════ */
    #loader {
      position: fixed; inset: 0;
      background: #000;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
    }
    #loader.done {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }
    #loader::before {
      content: '';
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 3px,
        rgba(0,255,159,0.03) 3px, rgba(0,255,159,0.03) 4px
      );
      pointer-events: none;
    }
    .ld-corner {
      position: absolute;
      width: 44px; height: 44px;
      border-color: var(--neon-green);
      border-style: solid;
      opacity: 0.45;
    }
    .ld-corner.tl { top:20px; left:20px;   border-width: 2px 0 0 2px; }
    .ld-corner.tr { top:20px; right:20px;  border-width: 2px 2px 0 0; }
    .ld-corner.bl { bottom:20px; left:20px;  border-width: 0 0 2px 2px; }
    .ld-corner.br { bottom:20px; right:20px; border-width: 0 2px 2px 0; }

    .ld-logo-wrap { position: relative; }
    .ld-logo {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: clamp(2.2rem, 7vw, 5rem);
      color: var(--neon-green);
      letter-spacing: 0.08em;
      animation: ldPulse 1.2s ease-in-out infinite alternate;
      position: relative; z-index: 1;
    }
    .ld-logo span { color: var(--neon-cyan); }
    @keyframes ldPulse {
      from { text-shadow: 0 0 10px #00ff9f, 0 0 20px #00ff9f44; }
      to   { text-shadow: 0 0 20px #00ff9f, 0 0 60px #00ff9f99, 0 0 100px #00ff9f33; }
    }
    /* glitch layers */
    .ld-g1, .ld-g2 {
      position: absolute; top:0; left:0;
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: clamp(2.2rem, 7vw, 5rem);
      letter-spacing: 0.08em;
      pointer-events: none;
      opacity: 0;
    }
    .ld-g1 { color: var(--neon-cyan);  clip-path: polygon(0 15%,100% 15%,100% 38%,0 38%); animation: g1 4s infinite; }
    .ld-g2 { color: #ff00cc;           clip-path: polygon(0 62%,100% 62%,100% 78%,0 78%); animation: g2 4s infinite; }
    @keyframes g1 { 0%,87%,100%{opacity:0;transform:translateX(0)} 88%{opacity:.9;transform:translateX(-8px)} 91%{opacity:.9;transform:translateX(5px)} 93%{opacity:0} }
    @keyframes g2 { 0%,90%,100%{opacity:0;transform:translateX(0)} 91%{opacity:.7;transform:translateX(7px)} 93%{opacity:.7;transform:translateX(-4px)} 95%{opacity:0} }

    .ld-tagline {
      font-family: 'Share Tech Mono', monospace;
      font-size: clamp(0.6rem, 1.5vw, 0.8rem);
      color: var(--neon-cyan);
      letter-spacing: 0.35em;
      text-transform: uppercase;
    }
    .ld-status {
      font-family: 'Share Tech Mono', monospace;
      font-size: clamp(0.65rem, 1.5vw, 0.78rem);
      color: var(--neon-green);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      min-height: 1.2em;
    }
    .ld-status::after { content:'_'; animation: blink .6s step-end infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    .ld-bar-wrap { width: clamp(260px, 55vw, 500px); }
    .ld-track {
      height: 4px; background: #0a1f28; border-radius: 2px;
      overflow: hidden; position: relative;
    }
    .ld-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan));
      box-shadow: 0 0 12px var(--neon-green);
      border-radius: 2px;
      transition: width 0.12s linear;
    }
    .ld-bar-info {
      display: flex; justify-content: space-between;
      margin-top: 0.6rem;
    }
    .ld-pct {
      font-family: 'Orbitron', monospace;
      font-size: 0.7rem; color: var(--neon-green);
      text-shadow: var(--glow-green);
    }
    .ld-hint {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.62rem; color: var(--text-muted);
      letter-spacing: 0.12em;
    }

    /* ═══════════════════════════════
       CUSTOM CURSOR
    ═══════════════════════════════ */
    #cursor {
      width:12px; height:12px;
      background: var(--neon-green);
      border-radius:50%;
      position:fixed; top:0; left:0;
      pointer-events:none; z-index:9999;
      box-shadow: var(--glow-green);
    }
    #cursor-ring {
      width:32px; height:32px;
      border:1px solid var(--neon-cyan);
      border-radius:50%;
      position:fixed; top:0; left:0;
      pointer-events:none; z-index:9998;
      opacity:0.6;
    }

    /* ═══════════════════════════════
       OVERLAYS
    ═══════════════════════════════ */
    body::before {
      content:''; position:fixed; inset:0;
      background: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,159,0.015) 2px,rgba(0,255,159,0.015) 4px);
      pointer-events:none; z-index:100;
    }
    body::after {
      content:''; position:fixed; inset:0;
      background-image:
        linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
      background-size:50px 50px;
      pointer-events:none; z-index:0;
    }

    /* ═══════════════════════════════
       NAVBAR
    ═══════════════════════════════ */
    nav {
      position:fixed; top:0; left:0; right:0; z-index:500;
      display:flex; align-items:center; justify-content:space-between;
      padding:0 5%; height:64px;
      background:rgba(2,11,15,0.88);
      backdrop-filter:blur(12px);
      border-bottom:1px solid var(--border);
    }
    .nav-logo {
      font-family:'Orbitron',monospace; font-weight:900; font-size:1.1rem;
      color:var(--neon-green); text-shadow:var(--glow-green);
      letter-spacing:0.12em; text-decoration:none;
    }
    .nav-logo span { color:var(--neon-cyan); }
    .nav-links { display:flex; gap:2.5rem; list-style:none; }
    .nav-links a {
      font-family:'Share Tech Mono',monospace; font-size:0.73rem;
      color:var(--text-muted); text-decoration:none;
      letter-spacing:0.12em; text-transform:uppercase;
      transition:color .2s, text-shadow .2s;
    }
    .nav-links a:hover { color:var(--neon-cyan); text-shadow:var(--glow-cyan); }
    .nav-status { display:flex; align-items:center; gap:.5rem; font-family:'Share Tech Mono',monospace; font-size:.7rem; color:var(--neon-green); }
    .status-dot { width:8px; height:8px; background:var(--neon-green); border-radius:50%; animation:pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{box-shadow:0 0 4px var(--neon-green);opacity:1} 50%{box-shadow:0 0 14px var(--neon-green);opacity:.6} }

    /* ═══════════════════════════════
       HERO
    ═══════════════════════════════ */
    #hero {
      position:relative; min-height:100vh;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      text-align:center; padding:64px 5% 0; overflow:hidden; z-index:1;
    }
    .hero-glow {
      position:absolute; inset:0; z-index:0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 80%, rgba(0,255,159,.08) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 50% 100%, rgba(0,229,255,.1) 0%, transparent 60%);
    }
    .particle { position:absolute; width:2px; height:2px; background:var(--neon-cyan); border-radius:50%; animation:floatUp linear infinite; opacity:0; }
    @keyframes floatUp { 0%{transform:translateY(100vh);opacity:0} 10%{opacity:.8} 90%{opacity:.8} 100%{transform:translateY(-20px) translateX(30px);opacity:0} }
    .hero-tag { font-family:'Share Tech Mono',monospace; font-size:.7rem; letter-spacing:.3em; color:var(--neon-cyan); text-shadow:var(--glow-cyan); margin-bottom:1.5rem; animation:fadeUp .6s .2s both; }
    .hero-name {
      font-family:'Orbitron',monospace; font-weight:900;
      font-size:clamp(2.8rem,9vw,7rem); line-height:.95;
      color:var(--neon-green); text-shadow:var(--glow-green);
      letter-spacing:.05em; position:relative; z-index:1;
      animation:fadeUp .7s .4s both, glitch 5s 2s infinite;
    }
    @keyframes glitch {
      0%,93%,100%{clip-path:none;transform:none}
      94%{clip-path:polygon(0 20%,100% 20%,100% 40%,0 40%);transform:translateX(-4px);color:var(--neon-cyan)}
      96%{clip-path:polygon(0 60%,100% 60%,100% 75%,0 75%);transform:translateX(4px);color:var(--neon-green)}
      97%{clip-path:none;transform:translateX(-2px)}
      98%{clip-path:none;transform:none}
    }
    .hero-sub { font-family:'Share Tech Mono',monospace; font-size:clamp(.72rem,1.8vw,.95rem); color:var(--text-muted); letter-spacing:.2em; margin-top:1rem; animation:fadeUp .7s .6s both; }
    .hero-sub span { color:var(--neon-cyan); }
    .hero-badges { display:flex; gap:1rem; flex-wrap:wrap; justify-content:center; margin-top:2.5rem; animation:fadeUp .7s .8s both; }
    .badge {
      padding:.4rem 1rem; border:1px solid var(--neon-cyan);
      font-family:'Share Tech Mono',monospace; font-size:.68rem; letter-spacing:.15em;
      color:var(--neon-cyan); text-shadow:var(--glow-cyan);
      clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
      background:rgba(0,229,255,.05);
    }
    .hero-cta { margin-top:3rem; animation:fadeUp .7s 1s both; }
    .btn-primary {
      font-family:'Orbitron',monospace; font-size:.75rem; font-weight:700;
      letter-spacing:.2em; text-decoration:none; padding:.9rem 2.5rem;
      border:2px solid var(--neon-green); color:var(--neon-green);
      clip-path:polygon(12px 0%,100% 0%,calc(100% - 12px) 100%,0% 100%);
      transition:all .2s; display:inline-block; cursor:none;
    }
    .btn-primary:hover { background:var(--neon-green); color:var(--dark-bg); box-shadow:var(--glow-green); }
    .scroll-hint {
      position:absolute; bottom:2.5rem;
      display:flex; flex-direction:column; align-items:center; gap:.5rem;
      font-family:'Share Tech Mono',monospace; font-size:.62rem; color:var(--text-muted); letter-spacing:.2em;
      animation:fadeIn 1s 1.5s both;
    }
    .scroll-arrow { width:1px; height:40px; background:linear-gradient(var(--neon-cyan),transparent); animation:sa 1.5s infinite; }
    @keyframes sa { 0%{transform:scaleY(0);transform-origin:top} 50%{transform:scaleY(1);transform-origin:top} 51%{transform:scaleY(1);transform-origin:bottom} 100%{transform:scaleY(0);transform-origin:bottom} }
    @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:none} }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }

    /* ═══════════════════════════════
       SECTIONS
    ═══════════════════════════════ */
    section { position:relative; z-index:1; padding:6rem 5%; }
    .section-label { font-family:'Share Tech Mono',monospace; font-size:.65rem; letter-spacing:.4em; color:var(--neon-green); text-shadow:var(--glow-green); text-transform:uppercase; margin-bottom:.75rem; }
    .section-label::before { content:'> '; }
    .section-title { font-family:'Orbitron',monospace; font-weight:900; font-size:clamp(1.8rem,4vw,3rem); color:var(--text-primary); line-height:1.1; margin-bottom:3rem; }
    .section-title em { font-style:normal; color:var(--neon-cyan); text-shadow:var(--glow-cyan); }
    .divider { width:100%; height:1px; background:linear-gradient(90deg,transparent,var(--neon-cyan),transparent); opacity:.3; }

    /* ORIGIN */
    .origin-grid { display:grid; grid-template-columns:1fr 1fr; gap:4rem; align-items:start; }
    .origin-text p { font-size:1.05rem; line-height:1.9; color:#8ab8b0; margin-bottom:1.25rem; }
    .origin-text p strong { color:var(--neon-green); }
    .origin-text p em { font-style:normal; color:var(--neon-cyan); }
    .stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
    .stat-card {
      background:var(--card-bg); border:1px solid var(--border); border-top:2px solid var(--neon-green);
      padding:1.5rem; clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));
      transition:border-color .2s;
    }
    .stat-card:hover { border-top-color:var(--neon-cyan); }
    .stat-value { font-family:'Orbitron',monospace; font-weight:900; font-size:2rem; color:var(--neon-green); text-shadow:var(--glow-green); line-height:1; }
    .stat-label { font-family:'Share Tech Mono',monospace; font-size:.62rem; color:var(--text-muted); letter-spacing:.15em; margin-top:.4rem; }

    /* GAMES */
    #games { background:linear-gradient(180deg,transparent,rgba(0,255,159,.02) 50%,transparent); }
    .games-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:1.5rem; }
    .game-card {
      background:var(--card-bg); border:1px solid var(--border);
      padding:1.75rem; position:relative; overflow:hidden;
      clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));
      transition:transform .2s, box-shadow .2s; cursor:none;
    }
    .game-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:var(--accent,var(--neon-green)); box-shadow:0 0 10px var(--accent,var(--neon-green)); transition:height .3s; }
    .game-card:hover { transform:translateY(-4px); box-shadow:0 12px 40px rgba(0,0,0,.5); }
    .game-card:hover::before { height:3px; }
    .game-icon { font-size:2.5rem; margin-bottom:1rem; display:block; }
    .game-name { font-family:'Orbitron',monospace; font-weight:700; font-size:.93rem; color:var(--text-primary); letter-spacing:.05em; margin-bottom:.3rem; }
    .game-genre { font-family:'Share Tech Mono',monospace; font-size:.62rem; color:var(--accent,var(--neon-green)); letter-spacing:.2em; margin-bottom:.75rem; }
    .game-desc { font-size:.9rem; color:var(--text-muted); line-height:1.6; }
    .skill-bar { margin-top:1rem; background:var(--border); height:3px; border-radius:2px; overflow:visible; position:relative; }
    .skill-fill { height:100%; width:0%; border-radius:2px; transition:width 1.5s ease; position:relative; }
    .skill-fill::after { content:''; position:absolute; right:0; top:50%; transform:translateY(-50%); width:8px; height:8px; background:var(--accent,var(--neon-green)); border-radius:50%; box-shadow:0 0 10px var(--accent,var(--neon-green)); }
    .skill-pct { font-family:'Share Tech Mono',monospace; font-size:.62rem; color:var(--text-muted); margin-top:.4rem; text-align:right; }

    /* TIMELINE */
    .tl-wrap { position:relative; padding-left:2.5rem; max-width:700px; }
    .tl-wrap::before { content:''; position:absolute; left:0; top:0; bottom:0; width:1px; background:linear-gradient(var(--neon-green),var(--neon-cyan),var(--neon-blue)); opacity:.4; }
    .tl-item { position:relative; margin-bottom:3rem; }
    .tl-dot { position:absolute; left:-2.95rem; top:.3rem; width:12px; height:12px; background:var(--neon-green); border-radius:50%; box-shadow:var(--glow-green); }
    .tl-year { font-family:'Orbitron',monospace; font-size:.7rem; font-weight:700; color:var(--neon-cyan); text-shadow:var(--glow-cyan); letter-spacing:.2em; margin-bottom:.4rem; }
    .tl-event { font-weight:600; font-size:1.1rem; color:var(--text-primary); margin-bottom:.3rem; }
    .tl-detail { font-size:.9rem; color:var(--text-muted); line-height:1.6; }

    /* LINKS */
    .links-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:1.25rem; }
    .link-card {
      display:flex; align-items:center; gap:1rem; padding:1.25rem 1.5rem;
      background:var(--card-bg); border:1px solid var(--border); text-decoration:none;
      clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));
      transition:all .2s; cursor:none;
    }
    .link-card:hover { border-color:var(--link-color,var(--neon-cyan)); background:rgba(0,229,255,.05); transform:translateX(4px); }
    .link-icon { font-size:1.5rem; flex-shrink:0; }
    .link-name { font-family:'Orbitron',monospace; font-weight:700; font-size:.78rem; color:var(--text-primary); letter-spacing:.05em; }
    .link-handle { font-family:'Share Tech Mono',monospace; font-size:.62rem; color:var(--link-color,var(--neon-cyan)); letter-spacing:.1em; margin-top:.2rem; }
    .link-arrow { margin-left:auto; font-size:.85rem; color:var(--link-color,var(--neon-cyan)); opacity:0; transform:translateX(-6px); transition:all .2s; }
    .link-card:hover .link-arrow { opacity:1; transform:translateX(0); }

    /* SETUP */
    .specs-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:1.25rem; }
    .spec-row { display:flex; align-items:center; gap:1rem; padding:1rem 1.25rem; background:var(--card-bg); border:1px solid var(--border); border-left:3px solid var(--neon-green); transition:border-left-color .2s; }
    .spec-row:hover { border-left-color:var(--neon-cyan); }
    .spec-key { font-family:'Share Tech Mono',monospace; font-size:.62rem; color:var(--text-muted); letter-spacing:.15em; text-transform:uppercase; min-width:80px; }
    .spec-val { font-family:'Rajdhani',sans-serif; font-weight:600; font-size:.95rem; color:var(--text-primary); }

    /* CONTACT */
    #contact { text-align:center; background:linear-gradient(180deg,transparent,rgba(0,255,159,.03)); }
    #contact .contact-inner { max-width:560px; margin:0 auto; }
    #contact p { font-size:1.05rem; color:var(--text-muted); line-height:1.8; margin-bottom:2.5rem; }
    .contact-btns { display:flex; gap:1rem; justify-content:center; flex-wrap:wrap; }
    .btn-secondary {
      font-family:'Orbitron',monospace; font-size:.7rem; font-weight:700;
      letter-spacing:.2em; text-decoration:none; padding:.75rem 2rem;
      border:1px solid var(--neon-cyan); color:var(--neon-cyan);
      clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
      transition:all .2s; cursor:none;
    }
    .btn-secondary:hover { background:var(--neon-cyan); color:var(--dark-bg); box-shadow:var(--glow-cyan); }

    /* FOOTER */
    footer { position:relative; z-index:1; border-top:1px solid var(--border); padding:2rem 5%; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem; }
    .footer-logo { font-family:'Orbitron',monospace; font-weight:900; font-size:1rem; color:var(--neon-green); text-shadow:var(--glow-green); }
    .footer-copy { font-family:'Share Tech Mono',monospace; font-size:.62rem; color:var(--text-muted); letter-spacing:.1em; }

    /* SCROLL REVEAL */
    .reveal { opacity:0; transform:translateY(30px); transition:opacity .7s ease, transform .7s ease; }
    .reveal.visible { opacity:1; transform:none; }

    /* RESPONSIVE */
    @media(max-width:768px) {
      .origin-grid { grid-template-columns:1fr; gap:2.5rem; }
      .nav-links { display:none; }
      .stat-grid { grid-template-columns:1fr 1fr; }
    }
  </style>
</head>
<body>

  <!-- ═
